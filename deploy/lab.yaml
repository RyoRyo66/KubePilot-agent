apiVersion: v1
kind: Namespace
metadata:
  name: kube-agent-lab
  labels:
    app.kubernetes.io/part-of: kubepilot-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: kube-agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-web }
  template:
    metadata:
      labels: { app: demo-web }
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: kube-agent-lab
spec:
  type: NodePort
  selector: { app: demo-web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
