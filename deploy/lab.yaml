apiVersion: v1
kind: Namespace
metadata:
  name: kube-agent-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: kube-agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-web}
  template:
    metadata:
      labels: {app: demo-web}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: node:24-bookworm-slim
          command: ["node", "-e", "require('http').createServer((q,r)=>r.end('healthy')).listen(8080)"]
          ports: [{name: http, containerPort: 8080}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 150m, memory: 96Mi}}
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: kube-agent-lab
spec:
  selector: {app: demo-web}
  ports: [{name: http, port: 80, targetPort: http}]
