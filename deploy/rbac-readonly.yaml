apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepilot
  namespace: kube-agent-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubepilot-reader
  namespace: kube-agent-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubepilot-reader
  namespace: kube-agent-lab
subjects:
  - kind: ServiceAccount
    name: kubepilot
    namespace: kube-agent-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubepilot-reader
