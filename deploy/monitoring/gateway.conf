worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    client_max_body_size 2m;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Only authenticated machine endpoints are reachable through this gateway.
    # The Windows UI remains on its existing loopback origin.
    location ~ ^/(ingest/alertmanager|connector/poll|connector/result)$ {
      limit_except POST { deny all; }
      proxy_pass http://host.docker.internal:18081;
      proxy_set_header Host 127.0.0.1:18081;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
    }
    location / { return 404; }
  }
}
