apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-worker
  namespace: kube-agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: fault-worker }
  template:
    metadata:
      labels: { app: fault-worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c", "sleep 86400"]
          resources:
            requests: { cpu: "100", memory: 64Mi }
            limits: { cpu: "100", memory: 64Mi }
