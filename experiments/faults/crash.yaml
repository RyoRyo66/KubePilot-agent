apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-worker
  namespace: kube-agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: fault-worker }
  template:
    metadata:
      labels: { app: fault-worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c", "echo 'required configuration APP_REGION is missing' >&2; exit 1"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
