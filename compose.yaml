services:
  laboratory:
    build:
      context: .
      target: platform
    command: ["node", "server/lab.js"]
    ports: ["127.0.0.1:18080:18080"]
    environment:
      AGENT_MODE: demo
      AGENT_HOST: 0.0.0.0
      AGENT_PUBLIC_ORIGIN: http://127.0.0.1:18080
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?需要本地实验台访问令牌}
    volumes: ["lab-v3:/app/data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  lab-v3:
