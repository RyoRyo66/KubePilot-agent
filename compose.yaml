services:
  kubepilot:
    build: .
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      AGENT_MODE: demo
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?请设置 AGENT_API_TOKEN 后启动容器}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
    volumes:
      - kubepilot-data:/app/data
    restart: unless-stopped
volumes:
  kubepilot-data:
